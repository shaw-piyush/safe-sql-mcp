name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # for tests that need a real Postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d olist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      # actions are pinned to commit SHAs, see docs/decisions.md
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and test
        run: make test
